# Publica la Suite QAQC en GitHub Pages cada vez que cambia un módulo.
#
# La suite NO se versiona: son ~8,7 MB por corte y guardarlos cada semana
# engordaría el repositorio sin aportar nada. Se arma aquí, en el servidor, a
# partir de los tres módulos que sí están versionados —el mismo
# `node armar_suite.js` de siempre, que solo usa módulos nativos de Node— y se
# publica el resultado. Así lo que se ve online es, por construcción, lo mismo
# que produce el corte local: no hay una segunda versión que pueda quedar atrás.
name: Publicar la Suite QAQC

# DORMIDO POR DECISIÓN (10-08-2026). El entregable sigue siendo el archivo
# `Suite_QAQC.html` que se manda por correo; la versión online queda para más
# adelante. Por eso solo dispara a mano: dejarlo en `push` hacía que cada corte
# terminara en una corrida fallida mientras Pages esté sin activar.
#
# Para reactivarlo cuando se quiera, dos pasos:
#   1. En GitHub: Settings → Pages → Source: «GitHub Actions».
#   2. Aquí: descomentar el bloque `push` de abajo.
# Lo demás está probado y funciona: la construcción, la auditoría previa y el
# control de peso corrieron en verde en el runner; lo único que faltaba era el
# paso 1.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "suite_qaqc/**"
  #     - "panel_control_TOP_P1/index.html"
  #     - "modulo_nc/index.html"
  #     - ".github/workflows/publicar.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cortes seguidos, gana el último: no tiene sentido publicar uno
# viejo encima del nuevo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Antes de publicar, el mismo control de fondo que se corre a mano: que la
      # misma cifra diga lo mismo en el JSON de cada módulo, en la portada y en
      # el texto de las PPT. Si no cuadra, el job muere aquí y Pages conserva la
      # versión anterior. Publicar rápido no vale nada si se publica mal.
      - name: Auditar la coherencia de los datos
        run: |
          # openpyxl y python-pptx: el auditor importa pptx dentro de una
          # función —para cruzar los JSON contra el texto de las láminas— y por
          # eso no aparece en los imports de arriba del archivo.
          python3 -m pip install --quiet openpyxl python-pptx
          python3 auditoria_datos.py

      - name: Armar la suite
        working-directory: suite_qaqc
        run: node armar_suite.js

      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp suite_qaqc/Suite_QAQC.html _sitio/index.html
          cp suite_qaqc/Suite_QAQC.html _sitio/Suite_QAQC.html
          # Visible para cualquiera que tenga el link, pero fuera de los
          # buscadores: el contenido trae nombres de cliente, códigos de
          # contrato y costos en UF, y no hay razón para que Google lo indexe.
          # Para que sí aparezca en búsquedas, borrar este bloque y robots.txt.
          # En binario a propósito: leer y escribir como texto normaliza los
          # saltos de línea y reescribiría 7.000 líneas que no tocamos.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("_sitio/index.html")
          d = p.read_bytes()
          meta = b'<meta name="robots" content="noindex, nofollow">'
          if meta not in d:
              p.write_bytes(d.replace(b"<head>", b"<head>\n" + meta, 1))
          PY
          printf 'User-agent: *\nDisallow: /\n' > _sitio/robots.txt

          # Red de seguridad tonta y eficaz: la suite ronda los 8,7 MB. Si sale
          # muy por debajo es que se armó a medias, y más vale no publicarla que
          # publicar un panel truncado que parece completo.
          peso=$(stat -c%s _sitio/index.html)
          echo "index.html: $peso bytes"
          if [ "$peso" -lt 5000000 ]; then
            echo "::error::La suite pesa $peso bytes, muy por debajo de lo normal (~8,7 MB). No se publica."
            exit 1
          fi
          ls -la _sitio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: desplegar
        uses: actions/deploy-pages@v4
